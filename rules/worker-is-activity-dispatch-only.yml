id: worker-is-activity-dispatch-only
language: python
severity: error
message: Worker may import only activity, dispatch, and telemetry, never Petri, history, binding, storage, private coordination, Fabric, or lifecycle.
files:
  - src/petrus/motus/worker/__init__.py
rule:
  any:
    - kind: import_statement
      regex: 'petrus(?:.impetus|.motus)?\.(petrinet|firing|history|instance|binding|history_store|_coordination|fabric|processes)'
    - kind: import_from_statement
      regex: 'petrus(?:.impetus|.motus)?\.(petrinet|firing|history|instance|binding|history_store|_coordination|fabric|processes)'
