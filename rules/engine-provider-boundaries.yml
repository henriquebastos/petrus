id: engine-sqlite-provider-boundary
language: python
severity: error
message: SQLite Engine composition may use only SQLite History plus neutral Dispatch.
files:
  - src/petrus/engine/sqlite.py
rule:
  any:
    - kind: import_from_statement
      regex: '(?s)^from petrus\.motus\.dispatch import .*\b(LocalDispatch|AbsurdDispatch)\b'
    - kind: import_statement
      regex: 'petrus(?:.impetus|.motus)?\.(worker|transport|fabric|processes|applications|dispatch\.|history_store\.postgres)'
    - kind: import_from_statement
      regex: 'petrus(?:.impetus|.motus)?\.(worker|transport|fabric|processes|applications|dispatch\.|history_store\.postgres)'
